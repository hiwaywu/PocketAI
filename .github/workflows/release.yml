# Builds the signed APK and publishes it as a GitHub release.
# Run it from the Actions tab (or the API) after bumping versionName and adding release-notes/v<version>.md.
name: Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.3 (must match versionName in app/build.gradle.kts)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # The action's default list includes "tools", which the SDK repository no longer has (sdkmanager fails).
          packages: platform-tools platforms;android-37.2 build-tools;36.0.0

      - name: Check version
        run: |
          grep -q "versionName = \"${{ inputs.version }}\"" app/build.gradle.kts \
            || { echo "versionName in app/build.gradle.kts is not ${{ inputs.version }}"; exit 1; }

      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.POCKETAI_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "Add the POCKETAI_KEYSTORE_BASE64 and POCKETAI_KEYSTORE_PASSWORD repository secrets first"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pocketai-release.jks"
          echo "POCKETAI_KEYSTORE=$RUNNER_TEMP/pocketai-release.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          POCKETAI_KEYSTORE_PASSWORD: ${{ secrets.POCKETAI_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/PocketAI-${{ inputs.version }}.apk"
          # Refuse to publish an APK signed with a throwaway debug key.
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "release/PocketAI-${{ inputs.version }}.apk" | grep -q "CN=Pocket AI" \
            || { echo "APK is not signed with the Pocket AI release key"; exit 1; }

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="release-notes/v${{ inputs.version }}.md"
          [ -f "$notes" ] || echo "Pocket AI ${{ inputs.version }}" > "$notes"
          gh release create "v${{ inputs.version }}" "release/PocketAI-${{ inputs.version }}.apk" \
            --title "Pocket AI ${{ inputs.version }}" --notes-file "$notes" --target "${{ github.sha }}"
